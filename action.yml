name: Swift package release
description: >-
  Mints a semantic version tag and a GitHub release for every
  push to a Swift package's default branch. The bump is derived
  from the package's public API diff since the previous tag, and
  the tagged commit pins the package's own dependencies to their
  latest versions.
inputs:
  initial-version:
    description: >-
      The version to tag, without a bump, when the repository
      has no version tag yet.
    required: true
  source-paths:
    default: Sources
    description: >-
      The space-separated paths that hold the package's Swift
      sources.
    required: false
  token:
    default: ${{ github.token }}
    description: A token with write access to the repository's contents.
    required: false
outputs:
  bump:
    description: >-
      The bump that was applied: `major`, `minor`, `patch`,
      `none`, `seed`, or `tagged`.
    value: ${{ steps.result.outputs.bump }}
  version:
    description: >-
      The version that was tagged, without the `v` prefix, or an
      empty string when nothing was tagged.
    value: ${{ steps.result.outputs.version }}
runs:
  using: composite
  steps:
    - name: Find previous version
      id: prev
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Prints the commit on this branch that a tag describes: the
        # tag's own commit, or its parent when the tag names a release
        # commit. Prints nothing when the tag describes no commit on
        # this branch.
        base_of() {
          local commit parent
          commit=$(git rev-parse "$1^{commit}")

          if git merge-base --is-ancestor "$commit" HEAD; then
            echo "$commit"
            return 0
          fi

          parent=$(git rev-parse --verify --quiet "$commit^" || true)

          if [ -n "$parent" ] \
              && git merge-base --is-ancestor "$parent" HEAD; then
            echo "$parent"
          fi
        }

        is_newer() {
          [ "$1" != "$2" ] \
            && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
        }

        base=""
        orphaned=""
        prev=""

        for tag in $(git tag -l 'v[0-9]*' | sort -V); do
          tag_base=$(base_of "$tag")

          if [ -n "$tag_base" ]; then
            base="$tag_base"
            prev="$tag"
          else
            orphaned="$orphaned $tag"
          fi
        done

        floor=""

        # Retire versions whose commits were rewritten away.
        for tag in $orphaned; do
          is_newer "$prev" "$tag" && continue

          echo "Retiring $tag: its commit is no longer on this branch."
          gh release delete "$tag" --yes --cleanup-tag \
            || git push origin --delete "$tag"
          git tag -d "$tag" >/dev/null 2>&1 || true
          floor="$tag"
        done

        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "floor=$floor" >> "$GITHUB_OUTPUT"
        echo "tag=$prev" >> "$GITHUB_OUTPUT"

        if [ -n "$base" ] \
            && [ "$base" = "$(git rev-parse HEAD)" ]; then
          echo "HEAD is already released as $prev; nothing to do."
          echo "state=tagged" >> "$GITHUB_OUTPUT"
        elif [ -n "$prev" ]; then
          echo "Previous version: $prev"
          echo "state=bump" >> "$GITHUB_OUTPUT"
        else
          echo "No version tag describes this branch; seeding."
          echo "state=seed" >> "$GITHUB_OUTPUT"
        fi

    - name: Decide bump
      id: bump
      if: steps.prev.outputs.state == 'bump'
      shell: bash
      env:
        BASE: ${{ steps.prev.outputs.base }}
        FLOOR: ${{ steps.prev.outputs.floor }}
        PREV: ${{ steps.prev.outputs.tag }}
        SCRIPTS: ${{ github.action_path }}/scripts
        SOURCE_PATHS: ${{ inputs.source-paths }}
      run: |
        set -euo pipefail

        count_lines() {
          wc -l < "$1"
        }

        platform_pattern='^[-+].*(swift-tools-version|\.(iOS|macOS|tvOS|visionOS|watchOS)\()'
        work="$RUNNER_TEMP/release"
        mkdir -p "$work"

        # shellcheck disable=SC2086
        python3 "$SCRIPTS/public_api.py" . "$BASE" $SOURCE_PATHS \
          > "$work/api_before.txt"

        # shellcheck disable=SC2086
        python3 "$SCRIPTS/public_api.py" . HEAD $SOURCE_PATHS \
          > "$work/api_after.txt"

        python3 "$SCRIPTS/api_diff.py" \
          "$work/api_before.txt" \
          "$work/api_after.txt" \
          --out-dir "$work"

        added=$(count_lines "$work/api_added.txt")
        extended=$(count_lines "$work/api_extended.txt")
        removed=$(count_lines "$work/api_removed.txt")
        platform=0

        if git diff "$BASE" HEAD -- Package.swift \
            | grep -Eq "$platform_pattern"; then
          platform=1
        fi

        lines=$(
          # shellcheck disable=SC2086
          git diff --numstat "$BASE" HEAD -- $SOURCE_PATHS Package.swift \
            | awk '{ total += $1 + $2 } END { print total + 0 }'
        )

        python3 "$SCRIPTS/decide_bump.py" \
          --added "$((added + extended))" \
          --floor "$FLOOR" \
          --lines "$lines" \
          --messages "$(git log --format=%B "$BASE"..HEAD)" \
          --platform-changed "$platform" \
          --prev "$PREV" \
          --removed "$removed" \
          | tee -a "$GITHUB_OUTPUT"

        echo "Changes since $PREV: $lines line(s) in $SOURCE_PATHS and Package.swift." \
          > "$work/summary.md"

    - name: Decide seed version
      id: seed
      if: steps.prev.outputs.state == 'seed'
      shell: bash
      env:
        FLOOR: ${{ steps.prev.outputs.floor }}
        INITIAL: ${{ inputs.initial-version }}
        SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -euo pipefail

        work="$RUNNER_TEMP/release"
        mkdir -p "$work"

        python3 "$SCRIPTS/decide_bump.py" \
          --floor "$FLOOR" \
          --seed "$INITIAL" \
          | tee -a "$GITHUB_OUTPUT"

        echo "Initial semantic version. Earlier history is unversioned." \
          > "$work/summary.md"

    - name: Tag and release
      id: release
      if: steps.prev.outputs.state != 'tagged' && steps.bump.outputs.bump != 'none'
      shell: bash
      env:
        BUMP: ${{ steps.bump.outputs.bump || 'seed' }}
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ github.repository_owner }}
        SCRIPTS: ${{ github.action_path }}/scripts
        VERSION: ${{ steps.bump.outputs.version || steps.seed.outputs.version }}
      run: |
        set -euo pipefail

        append_section() {
          [ -s "$2" ] || return 0

          echo
          echo "### $1"
          echo '```'
          cat "$2"
          echo '```'
        }

        new="v$VERSION"
        work="$RUNNER_TEMP/release"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        : > "$work/dependencies.txt"

        if [ -f Package.swift ]; then
          python3 "$SCRIPTS/pin_dependencies.py" --owner "$OWNER" Package.swift \
            > "$work/dependencies.txt"
        fi

        # A release commit carries the pinned manifest and is reachable
        # only through its tag; the branch itself stays unchanged.
        if ! git diff --quiet -- Package.swift; then
          git checkout --quiet --detach
          git commit --quiet --all --message "Pin dependencies for $new"
        fi

        {
          cat "$work/summary.md"
          append_section "Public API removed or changed" "$work/api_removed.txt"
          append_section "Public API added" "$work/api_added.txt"
          append_section "Public API extended (new defaulted parameters)" \
            "$work/api_extended.txt"
          append_section "Dependencies" "$work/dependencies.txt"
        } > "$work/release_notes.md"

        git tag -a "$new" -m "$new ($BUMP)"
        git push origin "$new"
        gh release create "$new" \
          --generate-notes \
          --notes-file "$work/release_notes.md" \
          --title "$new" \
          --verify-tag

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Result
      id: result
      shell: bash
      env:
        BUMP: ${{ steps.bump.outputs.bump || 'seed' }}
        STATE: ${{ steps.prev.outputs.state }}
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        case "$STATE" in
          tagged)
            echo "bump=tagged" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            ;;
        esac
