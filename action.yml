name: Swift package release
description: >-
  Mints a semantic version tag and a GitHub release for every
  push to a Swift package's default branch. The bump is derived
  from the package's public API diff since the previous tag.
inputs:
  initial-version:
    description: >-
      The version to tag, without a bump, when the repository
      has no version tag yet.
    required: true
  source-paths:
    default: Sources
    description: >-
      The space-separated paths that hold the package's Swift
      sources.
    required: false
  token:
    default: ${{ github.token }}
    description: A token with write access to the repository's contents.
    required: false
outputs:
  bump:
    description: >-
      The bump that was applied: `major`, `minor`, `patch`,
      `none`, `seed`, or `tagged`.
    value: ${{ steps.result.outputs.bump }}
  version:
    description: >-
      The version that was tagged, without the `v` prefix, or an
      empty string when nothing was tagged.
    value: ${{ steps.result.outputs.version }}
runs:
  using: composite
  steps:
    - name: Find previous version
      id: prev
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        is_newer() {
          [ "$1" != "$2" ] \
            && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
        }

        prev=$(
          git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null \
            || true
        )

        floor=""

        # Retire versions whose commits were rewritten away.
        for tag in $(git tag -l 'v[0-9]*' | sort -V); do
          git merge-base --is-ancestor "$tag" HEAD && continue
          is_newer "$prev" "$tag" && continue

          echo "Retiring $tag: its commit is no longer on this branch."
          gh release delete "$tag" --yes --cleanup-tag \
            || git push origin --delete "$tag"
          git tag -d "$tag" >/dev/null
          floor="$tag"
        done

        echo "floor=$floor" >> "$GITHUB_OUTPUT"

        if git describe --tags --exact-match --match 'v[0-9]*' HEAD \
            >/dev/null 2>&1; then
          echo "HEAD is already tagged; nothing to do."
          echo "state=tagged" >> "$GITHUB_OUTPUT"
        elif [ -n "$prev" ]; then
          echo "Previous version: $prev"
          echo "state=bump" >> "$GITHUB_OUTPUT"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
        else
          echo "No version tag reachable from HEAD; seeding."
          echo "state=seed" >> "$GITHUB_OUTPUT"
        fi

    - name: Decide bump
      id: bump
      if: steps.prev.outputs.state == 'bump'
      shell: bash
      env:
        FLOOR: ${{ steps.prev.outputs.floor }}
        PREV: ${{ steps.prev.outputs.tag }}
        SCRIPTS: ${{ github.action_path }}/scripts
        SOURCE_PATHS: ${{ inputs.source-paths }}
      run: |
        set -euo pipefail

        append_section() {
          [ -s "$2" ] || return 0

          echo
          echo "### $1"
          echo '```'
          cat "$2"
          echo '```'
        }

        count_lines() {
          wc -l < "$1"
        }

        platform_pattern='^[-+].*(swift-tools-version|\.(iOS|macOS|tvOS|visionOS|watchOS)\()'
        work="$RUNNER_TEMP/release"
        mkdir -p "$work"

        # shellcheck disable=SC2086
        python3 "$SCRIPTS/public_api.py" . "$PREV" $SOURCE_PATHS \
          > "$work/api_before.txt"

        # shellcheck disable=SC2086
        python3 "$SCRIPTS/public_api.py" . HEAD $SOURCE_PATHS \
          > "$work/api_after.txt"

        python3 "$SCRIPTS/api_diff.py" \
          "$work/api_before.txt" \
          "$work/api_after.txt" \
          --out-dir "$work"

        added=$(count_lines "$work/api_added.txt")
        extended=$(count_lines "$work/api_extended.txt")
        removed=$(count_lines "$work/api_removed.txt")
        platform=0

        if git diff "$PREV" HEAD -- Package.swift \
            | grep -Eq "$platform_pattern"; then
          platform=1
        fi

        lines=$(
          # shellcheck disable=SC2086
          git diff --numstat "$PREV" HEAD -- $SOURCE_PATHS Package.swift \
            | awk '{ total += $1 + $2 } END { print total + 0 }'
        )

        python3 "$SCRIPTS/decide_bump.py" \
          --added "$((added + extended))" \
          --floor "$FLOOR" \
          --lines "$lines" \
          --messages "$(git log --format=%B "$PREV"..HEAD)" \
          --platform-changed "$platform" \
          --prev "$PREV" \
          --removed "$removed" \
          | tee -a "$GITHUB_OUTPUT"

        {
          echo "Changes since $PREV: $lines line(s) in $SOURCE_PATHS and Package.swift."
          append_section "Public API removed or changed" "$work/api_removed.txt"
          append_section "Public API added" "$work/api_added.txt"
          append_section "Public API extended (new defaulted parameters)" \
            "$work/api_extended.txt"
        } > "$work/release_notes.md"

    - name: Tag and release
      if: steps.prev.outputs.state == 'bump' && steps.bump.outputs.bump != 'none'
      shell: bash
      env:
        BUMP: ${{ steps.bump.outputs.bump }}
        GH_TOKEN: ${{ inputs.token }}
        NEW: v${{ steps.bump.outputs.version }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW" -m "$NEW ($BUMP bump)"
        git push origin "$NEW"
        gh release create "$NEW" \
          --generate-notes \
          --notes-file "$RUNNER_TEMP/release/release_notes.md" \
          --title "$NEW" \
          --verify-tag

    - name: Seed first version
      id: seed
      if: steps.prev.outputs.state == 'seed'
      shell: bash
      env:
        FLOOR: ${{ steps.prev.outputs.floor }}
        GH_TOKEN: ${{ inputs.token }}
        INITIAL: ${{ inputs.initial-version }}
        SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -euo pipefail

        python3 "$SCRIPTS/decide_bump.py" \
          --floor "$FLOOR" \
          --seed "$INITIAL" \
          | tee -a "$GITHUB_OUTPUT"

        new="v$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n1)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$new" -m "$new (initial version)"
        git push origin "$new"
        gh release create "$new" \
          --notes "Initial semantic version. Earlier history is unversioned." \
          --title "$new" \
          --verify-tag

    - name: Result
      id: result
      shell: bash
      env:
        BUMP: ${{ steps.bump.outputs.bump }}
        SEEDED: ${{ steps.seed.outputs.version }}
        STATE: ${{ steps.prev.outputs.state }}
        VERSION: ${{ steps.bump.outputs.version }}
      run: |
        case "$STATE" in
          seed)
            echo "bump=seed" >> "$GITHUB_OUTPUT"
            echo "version=$SEEDED" >> "$GITHUB_OUTPUT"
            ;;
          tagged)
            echo "bump=tagged" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            ;;
        esac
